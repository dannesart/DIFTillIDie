# Nuxt 4 / Nitro detects Netlify automatically (NETLIFY=true) and builds with
# the `netlify` preset: static assets go to `dist/`, the SSR handler goes to
# `.netlify/functions-internal/server`. See README.md.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Mission #17: deploy previews (pull requests) are built with the desktop app
# shell switched on; production and branch deploys are not. See docs/app-shell.md.
[context.deploy-preview.environment]
  APP_SHELL = "1"
